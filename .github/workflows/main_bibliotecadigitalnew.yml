name: CI/CD - CodeQL + JUnit + Deploy to Azure Web App - bibliotecadigitalnew

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: 'bibliotecadigitalnew'
  JAVA_VERSION: '21'
  DISTRIBUTION: 'microsoft'
  POM_XML_DIRECTORY: '.'  # Ajusta si tu pom.xml está en otra carpeta

jobs:
  # ---------- CODEQL SECURITY ANALYSIS ----------
  codeql:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java

      - name: Build for CodeQL
        run: |
          mvn -B clean compile -DskipTests

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java"

  # ---------- JUNIT TESTS ----------
  test:
    name: Run JUnit Tests
    runs-on: ubuntu-latest
    needs: codeql  # Solo se ejecuta si CodeQL pasó

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Run Maven Tests
        run: |
          mvn -B clean test

      - name: Upload JUnit Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports
          path: target/surefire-reports/

  # ---------- BUILD & DEPLOY TO AZURE ----------
  deploy:
    name: Build & Deploy to Azure WebApp
    runs-on: ubuntu-latest
    needs: test  # Solo se ejecuta si los tests pasaron

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Build Package
        run: |
          mvn -B clean package -DskipTests

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: ${{ env.POM_XML_DIRECTORY }}/target/*.jar

      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D1B49B2F02EC48ECA2A6F5DC9EE11782 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8106A2D1A63246F9B86EEE6E360A254C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_CABB2800D89A435AB5CB46FF0BC153AE }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: 'Production'
          package: '*.jar'

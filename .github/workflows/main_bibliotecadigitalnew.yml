# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: CodeQL + Tests + Deploy to Azure Web App - bibliotecadigitalnew

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: 'bibliotecadigitalnew'
  JAVA_VERSION: '21'
  DISTRIBUTION: 'microsoft'
  POM_XML_DIRECTORY: '.'
  JAR_NAME: 'bibliotecadigitalnew.jar'

jobs:
  test_and_codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      # Limpiar carpeta target
      - name: Clean target folder
        run: rm -rf target/

      # Ejecutar tests unitarios
      - name: Run unit tests
        run: mvn clean test

      # Inicializar CodeQL
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: java

      # Ejecutar análisis CodeQL
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2

  build_and_deploy:
    runs-on: ubuntu-latest
    needs: test_and_codeql
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Clean target folder
        run: rm -rf target/

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Rename JAR
        run: mv target/*.jar target/${{ env.JAR_NAME }}

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: target/${{ env.JAR_NAME }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D1B49B2F02EC48ECA2A6F5DC9EE11782 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8106A2D1A63246F9B86EEE6E360A254C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_CABB2800D89A435AB5CB46FF0BC153AE }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: 'Production'
          package: target/${{ env.JAR_NAME }}

# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build, CodeQL, Test and Deploy JAR app to Azure Web App - bibliotecadigitalnew

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: 'bibliotecadigitalnew'
  JAVA_VERSION: '21'
  DISTRIBUTION: 'microsoft'
  POM_XML_DIRECTORY: '.'  # Ajusta si tu pom.xml está en otra carpeta

# ---------- CODEQL SECURITY ANALYSIS ----------
jobs:
  codeql:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java

      - name: Build for CodeQL
        run: |
          mvn -B clean compile -DskipTests

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java"

# ---------- JUNIT TESTS ----------
  test:
    name: Run JUnit Tests
    runs-on: ubuntu-latest
    needs: codeql  # solo se ejecuta si CodeQL pasa
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Run Maven Tests
        run: |
          mvn -B clean test

      - name: Upload JUnit Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports
          path: target/surefire-reports/

# ---------- BUILD & DEPLOY TO AZURE ----------
  build-deploy:
    name: Build & Deploy to Azure
    runs-on: ubuntu-latest
    needs: test  # solo se ejecuta si los tests pasan
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Build with Maven
        run: |
          mvn -B clean package -DskipTests

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: ${{ env.POM_XML_DIRECTORY }}/target/*.jar

      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D1B49B2F02EC48ECA2A6F5DC9EE11782 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8106A2D1A63246F9B86EEE6E360A254C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_CABB2800D89A435AB5CB46FF0BC153AE }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: 'Production'
          package: '*.jar'

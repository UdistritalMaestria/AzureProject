name: CodeQL + Unit Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  tests_and_codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write  # Para poder disparar el otro workflow

    steps:
      - uses: actions/checkout@v4

      # Setup Java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '21'

      # Limpiar carpeta target
      - name: Clean target folder
        run: rm -rf target/

      # Run unit tests
      - name: Run unit tests
        run: mvn clean test

      # CodeQL analysis
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: java

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2

      # Disparar workflow de despliegue si todo pasa
      - name: Trigger Azure deploy workflow
        uses: peter-evans/workflow-dispatch@v2
        with:
          workflow: main_bibliotecadigitalnew.yml
          ref: main

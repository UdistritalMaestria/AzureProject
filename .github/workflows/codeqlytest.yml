name: CodeQL + Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  DISTRIBUTION: 'microsoft'
  POM_XML_DIRECTORY: '.'  # Ajusta si tu pom.xml está en otra carpeta

jobs:
  codeql:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java

      - name: Build for CodeQL
        run: |
          cd $GITHUB_WORKSPACE/${{ env.POM_XML_DIRECTORY }}
          mvn -B clean compile -DskipTests

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java"

  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: codeql

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Run Maven Tests
        run: |
          cd $GITHUB_WORKSPACE/${{ env.POM_XML_DIRECTORY }}
          mvn -B clean test

      - name: Trigger Deployment Workflow
        if: success()
        uses: peter-evans/workflow-dispatch@v2
        with:
          workflow: main_bibliotecadigitalnew.yml
          ref: main

# Archivo de propiedades para ambiente PRODUCCIÓN
# Usar con: spring.profiles.active=prod

# ===== SERVER CONFIGURATION =====
server.port=8080
server.servlet.context-path=/
server.tomcat.threads.max=200

# ===== SSL/HTTPS =====
# En Azure, HTTPS se maneja con certificados de App Service
# pero es recomendable en local usar:
# server.ssl.enabled=true
# server.ssl.key-store=classpath:keystore.p12
# server.ssl.key-store-type=PKCS12

# ===== THYMELEAF =====
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=true

# ===== SECURITY HEADERS =====
# Headers se configuran vía SecurityHeadersConfig.java
# pero pueden extenderse aquí si es necesario

# ===== COMPRESSION =====
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.excluded-mime-types=image/png,image/jpeg,image/gif,image/webp

# ===== ERROR HANDLING - SECURITY =====
# NO exponer información técnica
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false

# ===== SESSION MANAGEMENT - SECURITY =====
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.domain=bibliotecadigitalnew-aehkeyf2cyahaycb.azurewebsites.net
server.servlet.session.timeout=15m
server.servlet.session.persistence.enabled=false

# ===== MVC LOGGING - SECURITY =====
spring.mvc.log-request-details=false

# ===== LOGGING =====
logging.level.root=WARN
logging.level.com.mcic=INFO
logging.level.org.springframework.security=INFO
logging.file.name=/var/log/webapp/biblioteca.log
logging.file.max-size=10MB
logging.file.max-history=30

# ===== ACTUATOR (si se agrega después) =====
# management.endpoints.web.exposure.include=health,metrics
# management.endpoint.health.show-details=when-authorized
# management.metrics.export.enabled=true

# ===== PERFORMANCE =====
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100
server.tomcat.connection-timeout=5000
spring.mvc.servlet.path=/

# ===== ENVIRONMENT =====
app.environment=production
app.version=1.0.0

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biblioteca - Dashboard</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap");
      * { box-sizing: border-box; }
      body { font-family: "Poppins", sans-serif; background: #f4f6fb; margin:0; }
      .layout { display:flex; min-height:100vh; }
      .sidebar { width:220px; background:#263238; color:white; padding:20px; }
      .brand { font-weight:700; font-size:1.1rem; margin-bottom:20px; }
      .nav { display:flex; flex-direction:column; gap:8px; }
      .nav button { background:transparent; color:inherit; border:none; text-align:left; padding:10px 12px; border-radius:8px; cursor:pointer; font-size:0.95rem; }
      .nav button.active, .nav button:hover { background:#37474f; }
      .main { flex:1; padding:28px; }
      .container { max-width:1100px; margin:auto; background:white; padding:24px; border-radius:12px; box-shadow:0 8px 20px rgba(0,0,0,0.06); }
      h1 { color:#1e293b; }
      /* reusar estilos simples */
      .form-section { background:#f5f7ff; padding:18px; border-radius:12px; margin-bottom:20px; border:1px solid #e0e7ff; }
      .form-group { margin-bottom:12px; }
      .error { color:#b00020; margin-bottom:10px; }
      label { display:block; font-weight:500; margin-bottom:6px; }
      input, select { width:100%; padding:8px 10px; border-radius:8px; border:1px solid #ccc; }
      button.primary { background: linear-gradient(135deg,#3f51b5,#5c6bc0); color:white; padding:8px 14px; border:none; border-radius:8px; cursor:pointer; }
      table { width:100%; border-collapse:collapse; margin-top:12px; }
      th, td { padding:10px; text-align:left; }
      th { background:#3f51b5; color:white; }
      .small-btn { background:#efefef; border-radius:6px; padding:6px 8px; border:none; cursor:pointer; }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">Biblioteca — Dashboard</div>
        <nav class="nav">
          <button id="btn-dashboard" class="active" data-module="dashboard">Dashboard</button>
          <button id="btn-libros" data-module="libros">Libros</button>
          <button id="btn-usuarios" data-module="usuarios">Usuarios</button>
          <button id="btn-prestamos" data-module="prestamos">Préstamos</button>
        </nav>
      </aside>
      <main class="main">
        <div class="container" id="main-content">
          <h1>Bienvenido a la Biblioteca</h1>
          <p>Selecciona un módulo en el menú izquierdo para gestionar libros, usuarios o préstamos.</p>
        </div>
      </main>
    </div>

    <!-- Banner de notificaciones -->
    <div id="app-banner" style="position:fixed;right:20px;top:20px;z-index:9999;display:none;min-width:260px;border-radius:8px;padding:12px;color:white;box-shadow:0 8px 20px rgba(0,0,0,0.12)"></div>

    <script>
      // Cargar módulo por nombre (fetch del fragmento)
      async function loadModule(name){
        const content = document.getElementById('main-content');
        try{
          const res = await fetch('/modulos/' + name);
          if(!res.ok) throw new Error('No se pudo cargar el módulo');
          const html = await res.text();
          content.innerHTML = html;
          activateModuleButtons(name);
          initModuleScripts(name);
        }catch(e){ showBanner('error', e.message); }
      }

      document.querySelectorAll('.nav button').forEach(b=>{
        b.addEventListener('click', ()=>{
          document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));
          b.classList.add('active');
          const module = b.getAttribute('data-module');
          if(module==='dashboard'){
            document.getElementById('main-content').innerHTML = '<h1>Bienvenido a la Biblioteca</h1><p>Selecciona un módulo en el menú izquierdo para gestionar libros, usuarios o préstamos.</p>';
          } else {
            loadModule(module);
          }
        });
      });

      function activateModuleButtons(name){
        // placeholder if modules require button highlighting inside
      }

      function initModuleScripts(name){
        if(name==='usuarios'){
          const btn = document.getElementById('btn-crear-usuario');
          if(btn) btn.addEventListener('click', async (e)=>{
            e.preventDefault();
            const nombre = document.getElementById('u-nombre').value;
            const email = document.getElementById('u-email').value;
            const telefono = document.getElementById('u-telefono') ? document.getElementById('u-telefono').value : '';
            const fechaNacimiento = document.getElementById('u-fechaNacimiento') ? document.getElementById('u-fechaNacimiento').value : '';
            const uErr = document.getElementById('u-error'); if(uErr){ uErr.style.display='none'; uErr.textContent=''; }
            if(!nombre || !nombre.trim()){ if(uErr){ uErr.textContent='El nombre es obligatorio'; uErr.style.display='block'; } showBanner('error','El nombre es obligatorio'); return; }
            const emailRegex = /^[A-Za-z0-9+_.-]+@[A-Za-z0-9.-]+$/;
            if(!email || !emailRegex.test(email)){ if(uErr){ uErr.textContent='Email inválido'; uErr.style.display='block'; } showBanner('error','Email inválido'); return; }
            if(telefono && telefono.replace(/[^0-9]/g,'').length < 7){ if(uErr){ uErr.textContent='Teléfono inválido'; uErr.style.display='block'; } showBanner('error','Teléfono inválido'); return; }
            if(fechaNacimiento){ try{ const d = new Date(fechaNacimiento); if(isNaN(d.getTime())){ throw new Error('invalid'); } const today = new Date(); if(d > today){ if(uErr){ uErr.textContent='Fecha de nacimiento no puede ser futura'; uErr.style.display='block'; } showBanner('error','Fecha de nacimiento no puede ser futura'); return; } }catch(x){ if(uErr){ uErr.textContent='Formato de fecha inválido (yyyy-MM-dd)'; uErr.style.display='block'; } showBanner('error','Formato de fecha inválido (yyyy-MM-dd)'); return; } }
            try{
              const res = await fetch('/api/usuarios/agregar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nombre,email,telefono,fechaNacimiento})});
              if(res.ok){ showBanner('success','Usuario creado'); loadModule('usuarios'); }
              else { const txt = await res.text(); showBanner('error', txt || 'Error al crear usuario'); }
            }catch(err){ showBanner('error', 'Error: '+err.message); }
          });
        }
        if(name==='prestamos'){
          const btn = document.getElementById('btn-crear-prestamo');
          if(btn) btn.addEventListener('click', async (e)=>{
            e.preventDefault();
            const usuarioId = document.getElementById('p-usuario').value;
            const libroId = document.getElementById('p-libro').value;
            const pErr = document.getElementById('p-error'); if(pErr){ pErr.style.display='none'; pErr.textContent=''; }
            if(!usuarioId){ if(pErr){ pErr.textContent='Selecciona un usuario'; pErr.style.display='block'; } showBanner('error','Selecciona un usuario'); return; }
            if(!libroId){ if(pErr){ pErr.textContent='Selecciona un libro'; pErr.style.display='block'; } showBanner('error','Selecciona un libro'); return; }
            try{
              const res = await fetch('/api/prestamos/crear',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuarioId,libroId})});
              if(res.ok){ showBanner('success','Préstamo creado'); loadModule('prestamos'); }
              else { const txt = await res.text(); showBanner('error', txt || 'Error al crear préstamo'); }
            }catch(err){ showBanner('error','Error: '+err.message); }
          });
        }
        if(name==='libros'){
          // manejar submit por JS para evitar redirect al dashboard
          const form = document.getElementById('form-libro');
          if(form){
            form.addEventListener('submit', async function(e){
              e.preventDefault();
              const titulo = document.getElementById('l-titulo').value;
              const autor = document.getElementById('l-autor').value;
              const isbn = document.getElementById('l-isbn').value;
              const cantidad = document.getElementById('l-cantidad').value || 1;
              // client-side validation
              const lErr = document.getElementById('l-error');
              if(lErr){ lErr.style.display='none'; lErr.textContent=''; }
              if(!titulo || !titulo.trim()){ if(lErr){ lErr.textContent='El título es obligatorio'; lErr.style.display='block'; } showBanner('error','El título es obligatorio'); return; }
              if(!autor || !autor.trim()){ if(lErr){ lErr.textContent='El autor es obligatorio'; lErr.style.display='block'; } showBanner('error','El autor es obligatorio'); return; }
              const isbnClean = (isbn||'').replace(/[-\s]/g,'');
              if(isbnClean.length < 10){ if(lErr){ lErr.textContent='El ISBN debe tener al menos 10 caracteres'; lErr.style.display='block'; } showBanner('error','El ISBN es inválido'); return; }
              const qty = parseInt(cantidad,10);
              if(isNaN(qty) || qty < 1){ if(lErr){ lErr.textContent='La cantidad debe ser un número mayor o igual a 1'; lErr.style.display='block'; } showBanner('error','Cantidad inválida'); return; }
              try{
                const res = await fetch('/api/libros/agregar',{
                  method:'POST', headers:{'Content-Type':'application/json'},
                  body: JSON.stringify({ titulo, autor, isbn, cantidad: qty })
                });
                if(res.ok){ showBanner('success','Libro agregado'); loadModule('libros'); }
                else { const txt = await res.text(); showBanner('error', txt || 'Error al agregar libro'); }
              }catch(err){ showBanner('error','Error: '+err.message); }
            });
          }

          // acciones de incrementar/decrementar/eliminar via fetch
          document.querySelectorAll('[data-increment]').forEach(btn=>btn.addEventListener('click', async (e)=>{
            const id = btn.getAttribute('data-increment');
            try{ const res = await fetch('/api/libros/incrementar/' + id, { method: 'POST' });
              if(res.ok){ showBanner('success','Stock incrementado'); loadModule('libros'); }
              else showBanner('error','No se pudo incrementar');
            }catch(err){ showBanner('error','Error: '+err.message); }
          }));

          document.querySelectorAll('[data-decrement]').forEach(btn=>btn.addEventListener('click', async (e)=>{
            const id = btn.getAttribute('data-decrement');
            try{ const res = await fetch('/api/libros/decrementar/' + id, { method: 'POST' });
              if(res.ok){ showBanner('success','Stock decrementado'); loadModule('libros'); }
              else showBanner('error', await res.text());
            }catch(err){ showBanner('error','Error: '+err.message); }
          }));

          document.querySelectorAll('[data-delete]').forEach(btn=>btn.addEventListener('click', async (e)=>{
            const id = btn.getAttribute('data-delete');
            if(!confirm('Eliminar libro?')) return;
            try{ const res = await fetch('/api/libros/eliminar/' + id, { method: 'POST' });
              if(res.ok){ showBanner('success','Libro eliminado'); loadModule('libros'); }
              else showBanner('error','No se pudo eliminar');
            }catch(err){ showBanner('error','Error: '+err.message); }
          }));
        }
        // add devolver and deleteUser functions for dynamic buttons
        document.querySelectorAll('[data-delete-user]').forEach(btn=>btn.addEventListener('click', async ()=>{
          const id = btn.getAttribute('data-delete-user');
          if(!confirm('Eliminar usuario?')) return;
          try{ const res = await fetch('/api/usuarios/' + id, { method: 'DELETE' });
            if(res.ok){ showBanner('success','Usuario eliminado'); loadModule('usuarios'); }
            else showBanner('error','No se pudo eliminar');
          }catch(err){ showBanner('error','Error: '+err.message); }
        }));

        document.querySelectorAll('[data-devolver]').forEach(btn=>btn.addEventListener('click', async ()=>{
          const id = btn.getAttribute('data-devolver');
          if(!confirm('Marcar como devuelto?')) return;
          try{ const res = await fetch('/api/prestamos/devolver/' + id, { method: 'POST' });
            if(res.ok){ showBanner('success','Préstamo devuelto'); loadModule('prestamos'); }
            else showBanner('error', await res.text());
          }catch(err){ showBanner('error','Error: '+err.message); }
        }));
      }

      // Función para mostrar banner (success|error|info)
      function showBanner(type, message, timeout=3500){
        const el = document.getElementById('app-banner');
        if(!el) return;
        let bg = '#333';
        if(type==='success') bg = 'linear-gradient(90deg,#43a047,#66bb6a)';
        if(type==='error') bg = 'linear-gradient(90deg,#e53935,#ef5350)';
        if(type==='info') bg = 'linear-gradient(90deg,#1e88e5,#42a5f5)';
        el.style.background = bg;
        el.style.display = 'block';
        el.textContent = message;
        // animación simple
        el.style.opacity = '0';
        el.style.transform = 'translateY(-6px)';
        setTimeout(()=>{ el.style.transition='300ms'; el.style.opacity='1'; el.style.transform='translateY(0)'; },10);
        if(timeout>0){ clearTimeout(el._timer); el._timer = setTimeout(()=>{ el.style.opacity='0'; setTimeout(()=>el.style.display='none',300); }, timeout); }
      }
    </script>
  </body>
</html>

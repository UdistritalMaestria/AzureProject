# Archivo de propiedades para ambiente DESARROLLO
# Usar con: spring.profiles.active=dev

# ===== SERVER CONFIGURATION =====
server.port=8080
server.servlet.context-path=/

# ===== THYMELEAF (sin cache para desarrollo) =====
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# ===== SECURITY HEADERS =====
# Headers se aplican vía SecurityHeadersConfig.java

# ===== ERROR HANDLING - DEVELOPMENT (más verbose para debugging) =====
# En desarrollo es útil ver detalles, pero NUNCA en producción
server.error.include-message=always
server.error.include-stacktrace=always
server.error.include-exception=true
server.error.include-binding-errors=always
server.error.whitelabel.enabled=false

# ===== SESSION MANAGEMENT =====
server.servlet.session.cookie.http-only=true
# En desarrollo local, secure puede causar problemas, pero en servidor:
# server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

# ===== MVC LOGGING - para debugging =====
spring.mvc.log-request-details=true

# ===== LOGGING - DEVELOPMENT (verbose) =====
logging.level.root=INFO
logging.level.com.mcic=DEBUG
logging.level.org.springframework=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# ===== COMPRESSION =====
server.compression.enabled=false

# ===== PERFORMANCE (desarrollo) =====
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=5

# ===== ENVIRONMENT =====
app.environment=development
app.version=1.0.0-SNAPSHOT
